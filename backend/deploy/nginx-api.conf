# /etc/nginx/sites-available/api.lahiyarouwadayaro.com
#
# Reverse proxy HTTPS devant l'API Node (qui n'écoute que sur 127.0.0.1:3000).
# Config HTTP de départ : `certbot --nginx -d api.lahiyarouwadayaro.com`
# y ajoute ensuite le bloc HTTPS et la redirection HTTP -> HTTPS (voir README).

upstream lahiyarouwa_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.lahiyarouwadayaro.com;

    server_tokens off;

    # Même plafond que express.json({ limit: '100kb' }) côté API.
    client_max_body_size 100k;

    access_log /var/log/nginx/api.lahiyarouwadayaro.com.access.log;
    error_log /var/log/nginx/api.lahiyarouwadayaro.com.error.log warn;

    location / {
        proxy_pass http://lahiyarouwa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # L'API lit l'IP réelle du client via X-Forwarded-For (TRUST_PROXY=1)
        # pour son rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
