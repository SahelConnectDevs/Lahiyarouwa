# /etc/nginx/sites-available/admin.lahiyarouwadayaro.com
#
# Sert l'admin-web (fichiers statiques de `npm run build`) et relaie /api
# vers l'API Node du même VPS : l'admin et l'API partagent ainsi la même
# origine (pas de CORS, CSP `connect-src 'self'`).
# Config HTTP de départ : `certbot --nginx -d admin.lahiyarouwadayaro.com`
# y ajoute ensuite le HTTPS et la redirection HTTP -> HTTPS (voir README).

server {
    listen 80;
    listen [::]:80;
    server_name admin.lahiyarouwadayaro.com;

    server_tokens off;
    root /var/www/admin.lahiyarouwadayaro.com/current;
    index index.html;

    # Même plafond que express.json({ limit: '100kb' }) côté API.
    client_max_body_size 100k;

    access_log /var/log/nginx/admin.lahiyarouwadayaro.com.access.log;
    error_log /var/log/nginx/admin.lahiyarouwadayaro.com.error.log warn;

    # En-têtes de sécurité (aucune ressource tierce : tout vient de 'self').
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # API : même service que api.lahiyarouwadayaro.com.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # L'API lit l'IP réelle du client via X-Forwarded-For (TRUST_PROXY=1)
        # pour son rate limiting (dont l'anti brute-force de /auth/login).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fichiers versionnés par Vite (nom avec empreinte) : cache long.
    # `expires` plutôt qu'add_header, pour ne pas perdre les en-têtes ci-dessus.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Application monopage : toute autre URL renvoie index.html, jamais mis en cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
