# Template prêt à l'emploi : path-scopé à admin-web/, donc inoffensif tant
# que ce dossier n'existe pas. Écrit pour un outillage Node générique
# (npm ci / lint / build) qui convient à React, Next.js ou Vue — ajuste les
# scripts npm une fois le framework choisi. Voir CLAUDE.md > Continuous Integration.
name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
