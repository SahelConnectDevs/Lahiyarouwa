# Path-scopé à backend/, donc ne se déclenche que sur un changement dans ce
# dossier. Les tests utilisent mongodb-memory-server (voir backend/tests) :
# pas besoin de service Mongo ici, l'instance est éphémère et embarquée dans
# le process de test lui-même — identique en local et en CI.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (type-check)
        run: npm run build

      - name: Run tests
        run: npm test
