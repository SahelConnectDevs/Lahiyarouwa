# /etc/nginx/sites-available/lahiyarouwadayaro.com
#
# Config HTTP de départ : `certbot --nginx` y ajoute ensuite automatiquement
# le bloc HTTPS (port 443) et la redirection HTTP -> HTTPS (voir README).

# www -> domaine nu
server {
    listen 80;
    listen [::]:80;
    server_name www.lahiyarouwadayaro.com;
    return 301 https://lahiyarouwadayaro.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lahiyarouwadayaro.com;

    # `current` est un lien symbolique vers la dernière version déployée
    # (voir deploy.sh), ce qui rend chaque mise en ligne atomique.
    root /var/www/lahiyarouwadayaro.com/current;
    index index.html;
    charset utf-8;

    server_tokens off;
    include /etc/nginx/snippets/lahiyarouwa-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    # URLs propres : /confidentialite sert confidentialite.html
    # Les pages HTML sont toujours revalidées pour que les mises à jour
    # (politique de confidentialité notamment) soient visibles immédiatement.
    location / {
        include /etc/nginx/snippets/lahiyarouwa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Les anciennes URLs en .html redirigent vers la version propre.
    location ~ ^/(confidentialite|suppression-compte)\.html$ {
        return 301 /$1;
    }

    # Fichiers statiques : cache navigateur de 30 jours.
    location ~* \.(css|js|webp|png|jpg|ico|svg)$ {
        include /etc/nginx/snippets/lahiyarouwa-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
