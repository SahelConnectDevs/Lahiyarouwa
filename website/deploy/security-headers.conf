# En-têtes de sécurité, inclus dans chaque bloc server/location qui ajoute
# ses propres add_header (nginx n'hérite pas des add_header du niveau parent).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Le site n'utilise que ses propres fichiers : aucun script, police ou traceur tiers.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
# HSTS : actif seulement une fois le site servi en HTTPS (ignoré par les navigateurs en HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
